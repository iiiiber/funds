<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - FundQuant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: "Inter", system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; margin: 0; }
        .glass-card { background: rgba(30, 30, 50, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(99, 102, 241, 0.15); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); }
        .nav-item { transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(99, 102, 241, 0.2); }
        .spinner { border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid #6366f1; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white">
    <div class="flex min-h-screen">
        <!-- 侧边栏 -->
        <aside class="w-64 glass-card m-4 rounded-2xl p-4 flex flex-col">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M3 3v18h18"/><path d="M18 9l-5-6-4 10-3-3"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">FundQuant</h1>
                    <p class="text-xs text-slate-400">管理后台</p>
                </div>
            </div>
            
            <nav class="flex-1 space-y-1">
                <a href="/admin/" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm active">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                    <span>首页概览</span>
                </a>
                <a href="/admin/holdings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <span>持仓管理</span>
                </a>
                <a href="/admin/models" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg>
                    <span>AI模型</span>
                </a>
                <a href="/admin/feishu" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    <span>飞书推送</span>
                </a>
                <a href="/admin/apis" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    <span>API管理</span>
                </a>
                <a href="/admin/settings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                    <span>系统设置</span>
                </a>
                <a href="/admin/logs" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <span>操作日志</span>
                </a>
            </nav>
            
            <div class="border-t border-slate-700 pt-4 mt-4">
                <div class="flex items-center justify-between px-4 py-2">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-sm font-medium">A</div>
                        <div>
                            <p class="text-sm font-medium" id="admin-name">Admin</p>
                            <p class="text-xs text-slate-400">管理员</p>
                        </div>
                    </div>
                    <button onclick="logout()" class="text-slate-400 hover:text-white p-2" title="退出">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- 主内容 -->
        <main class="flex-1 p-4 pr-8">
            <h2 class="text-2xl font-bold mb-6">首页概览</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <div class="glass-card rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-slate-400 text-sm">持仓数量</span>
                        <span class="text-2xl" id="stat-holdings">-</span>
                    </div>
                </div>
                <div class="glass-card rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-slate-400 text-sm">AI模型</span>
                        <span class="text-2xl" id="stat-models">-</span>
                    </div>
                </div>
                <div class="glass-card rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-slate-400 text-sm">API配置</span>
                        <span class="text-2xl" id="stat-apis">-</span>
                    </div>
                </div>
                <div class="glass-card rounded-xl p-6">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-slate-400 text-sm">最后登录</span>
                        <span class="text-sm" id="stat-login">-</span>
                    </div>
                </div>
            </div>
            
            <div class="glass-card rounded-xl p-6">
                <h3 class="text-lg font-semibold mb-4">快捷操作</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <a href="/admin/holdings" class="flex items-center gap-3 p-4 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 transition">
                        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                        <span>添加持仓</span>
                    </a>
                    <a href="/admin/models" class="flex items-center gap-3 p-4 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 transition">
                        <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg>
                        <span>配置模型</span>
                    </a>
                    <a href="/admin/apis" class="flex items-center gap-3 p-4 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 transition">
                        <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <span>管理API</span>
                    </a>
                    <a href="/admin/" onclick="location.reload()" class="flex items-center gap-3 p-4 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 transition">
                        <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                        <span>刷新数据</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
    
    <script>
    async function loadStats() {
        try {
            var resp = await fetch('/admin/api/holdings/api/list?page_size=1');
            var data = await resp.json();
            if (data.success) {
                document.getElementById('stat-holdings').textContent = data.data.total || 0;
            }
        } catch(e) {}
        
        try {
            var resp = await fetch('/admin/api/models/api/list');
            var data = await resp.json();
            if (data.success) {
                document.getElementById('stat-models').textContent = data.data.length || 0;
            }
        } catch(e) {}
        
        try {
            var resp = await fetch('/admin/api/apis/api/list');
            var data = await resp.json();
            if (data.success) {
                document.getElementById('stat-apis').textContent = data.data.length || 0;
            }
        } catch(e) {}
        
        try {
            var resp = await fetch('/admin/api/auth/info');
            var data = await resp.json();
            if (data.success && data.data.last_login) {
                document.getElementById('stat-login').textContent = data.data.last_login.substring(0, 10);
            }
        } catch(e) {}
    }
    
    async function logout() {
        await fetch('/admin/api/auth/logout', {method: 'POST'});
        window.location.href = '/admin/login';
    }
    
    loadStats();
    </script>
</body>
</html>
