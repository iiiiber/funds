<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - FundQuant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: "Inter", system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; margin: 0; }
        .glass-card { background: rgba(30, 30, 50, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(99, 102, 241, 0.15); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); }
        .nav-item { transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(99, 102, 241, 0.2); }
        input, select, textarea { background: rgba(30, 30, 50, 0.6) !important; border: 1px solid rgba(99, 102, 241, 0.2) !important; }
        input:focus, select:focus, textarea:focus { border-color: rgba(99, 102, 241, 0.5) !important; outline: none; }
        .modal { background: rgba(0,0,0,0.6); }
        .toast { animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="text-white">
    <!-- Toast -->
    <div id="toast" class="fixed top-4 right-4 z-50 hidden">
        <div class="glass-card rounded-xl px-4 py-3 text-sm"></div>
    </div>
    
    <div class="flex min-h-screen">
        <aside class="w-64 glass-card m-4 rounded-2xl p-4 flex flex-col">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5-6-4 10-3-3"/></svg>
                </div>
                <div><h1 class="font-bold text-lg">FundQuant</h1><p class="text-xs text-slate-400">管理后台</p></div>
            </div>
            <nav class="flex-1 space-y-1">
                <a href="/admin/" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>首页概览</span>
                </a>
                <a href="/admin/holdings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>持仓管理</span>
                </a>
                <a href="/admin/models" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg><span>AI模型</span>
                </a>
                <a href="/admin/feishu" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm"><svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>飞书推送</span></a>
                <a href="/admin/apis" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>API管理</span>
                </a>
                <a href="/admin/settings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm active">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg><span>系统设置</span>
                </a>
                <a href="/admin/logs" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>操作日志</span>
                </a>
            </nav>
            <div class="border-t border-slate-700 pt-4 mt-4">
                <div class="flex items-center justify-between px-4 py-2">
                    <span class="text-sm">Admin</span>
                    <button onclick="logout()" class="text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </div>
        </aside>
        
        <main class="flex-1 p-4 pr-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">系统设置</h2>
                <button onclick="showAddModal()" class="btn-gradient px-4 py-2 rounded-xl text-sm font-medium">+ 添加设置</button>
            </div>
            
            <div class="glass-card rounded-xl p-6 mb-6">
                <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                    预设配置项
                </h3>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <button onclick="addPreset('site_title', 'FundQuant 管理后台', 'string', '网站标题')" class="p-3 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left text-sm transition">
                        <span class="text-cyan-400">site_title</span>
                        <p class="text-slate-400 text-xs mt-1">网站标题</p>
                    </button>
                    <button onclick="addPreset('page_size', '20', 'int', '默认分页数')" class="p-3 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left text-sm transition">
                        <span class="text-cyan-400">page_size</span>
                        <p class="text-slate-400 text-xs mt-1">默认分页数</p>
                    </button>
                    <button onclick="addPreset('cache_enabled', 'true', 'string', '缓存开关')" class="p-3 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left text-sm transition">
                        <span class="text-cyan-400">cache_enabled</span>
                        <p class="text-slate-400 text-xs mt-1">缓存开关</p>
                    </button>
                    <button onclick="addPreset('auto_refresh', 'false', 'string', '自动刷新')" class="p-3 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left text-sm transition">
                        <span class="text-cyan-400">auto_refresh</span>
                        <p class="text-slate-400 text-xs mt-1">自动刷新</p>
                    </button>
                    <button onclick="addPreset('max_holdings', '50', 'int', '最大持仓数')" class="p-3 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left text-sm transition">
                        <span class="text-cyan-400">max_holdings</span>
                        <p class="text-slate-400 text-xs mt-1">最大持仓数</p>
                    </button>
                    <button onclick="addPreset('data_backup_path', '/www/backup/funds', 'string', '备份路径')" class="p-3 bg-slate-800/50 rounded-xl hover:bg-slate-700/50 text-left text-sm transition">
                        <span class="text-cyan-400">data_backup_path</span>
                        <p class="text-slate-400 text-xs mt-1">备份路径</p>
                    </button>
                </div>
            </div>
            
            <div class="glass-card rounded-xl overflow-hidden">
                <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="text-lg font-semibold">当前配置</h3>
                    <button onclick="loadData()" class="text-sm text-slate-400 hover:text-white">刷新</button>
                </div>
                <div id="settings-list" class="divide-y divide-slate-700">
                    <div class="p-8 text-center text-slate-400">加载中...</div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 弹窗 -->
    <div id="modal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="glass-card rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold mb-4" id="modal-title">添加设置</h3>
            <form id="form" onsubmit="return handleSubmit(event)">
                <div class="space-y-4">
                    <div><label class="block text-sm text-slate-400 mb-1">配置键</label><input type="text" id="f-key" required class="w-full px-4 py-2 rounded-xl" placeholder="如: site_title"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">配置值</label><input type="text" id="f-value" required class="w-full px-4 py-2 rounded-xl" placeholder="配置值"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">类型</label>
                        <select id="f-type" class="w-full px-4 py-2 rounded-xl">
                            <option value="string">字符串</option>
                            <option value="int">整数</option>
                            <option value="bool">布尔</option>
                            <option value="json">JSON</option>
                        </select>
                    </div>
                    <div><label class="block text-sm text-slate-400 mb-1">说明</label><input type="text" id="f-remark" class="w-full px-4 py-2 rounded-xl" placeholder="配置项说明"></div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl">取消</button>
                    <button type="submit" class="flex-1 btn-gradient px-4 py-2 rounded-xl font-medium">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
    var settings = [];
    
    function showToast(msg, isError) {
        var toast = document.getElementById('toast');
        toast.querySelector('div').textContent = msg;
        toast.querySelector('div').className = 'glass-card rounded-xl px-4 py-3 text-sm ' + (isError ? 'text-red-400' : 'text-green-400');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
    }
    
    async function loadData() {
        try {
            var resp = await fetch('/admin/api/settings/settings/list');
            var data = await resp.json();
            if (data.success) {
                settings = data.data;
                renderList();
            }
        } catch(e) {
            showToast('加载失败', true);
        }
    }
    
    function renderList() {
        var el = document.getElementById('settings-list');
        if (settings.length === 0) {
            el.innerHTML = '<div class="p-8 text-center text-slate-400">暂无配置，点击上方预设或添加新配置</div>';
            return;
        }
        el.innerHTML = settings.map(function(s) {
            return '<div class="p-4 hover:bg-slate-800/30 transition flex items-center justify-between">' +
                '<div class="flex-1">' +
                    '<div class="flex items-center gap-3">' +
                        '<span class="text-cyan-400 font-mono">' + s.setting_key + '</span>' +
                        '<span class="px-2 py-0.5 text-xs rounded bg-slate-700 text-slate-400">' + (s.setting_type || 'string') + '</span>' +
                    '</div>' +
                    '<div class="mt-1 text-sm text-slate-300 font-mono">' + s.setting_value + '</div>' +
                    (s.remark ? '<div class="mt-1 text-xs text-slate-500">' + s.remark + '</div>' : '') +
                '</div>' +
                '<div class="flex items-center gap-2 ml-4">' +
                    '<button onclick="editSetting(\'' + s.setting_key + '\')" class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>' +
                    '<button onclick="deleteSetting(\'' + s.setting_key + '\')" class="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-700 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
                '</div>' +
            '</div>';
        }).join('');
    }
    
    function showAddModal() {
        document.getElementById('modal-title').textContent = '添加设置';
        document.getElementById('f-key').value = '';
        document.getElementById('f-key').disabled = false;
        document.getElementById('f-value').value = '';
        document.getElementById('f-type').value = 'string';
        document.getElementById('f-remark').value = '';
        document.getElementById('modal').classList.remove('hidden');
    }
    
    function editSetting(key) {
        var s = settings.find(function(x) { return x.setting_key === key; });
        if (!s) return;
        document.getElementById('modal-title').textContent = '编辑设置';
        document.getElementById('f-key').value = s.setting_key;
        document.getElementById('f-key').disabled = true;
        document.getElementById('f-value').value = s.setting_value;
        document.getElementById('f-type').value = s.setting_type || 'string';
        document.getElementById('f-remark').value = s.remark || '';
        document.getElementById('modal').classList.remove('hidden');
    }
    
    function addPreset(key, value, type, remark) {
        document.getElementById('f-key').value = key;
        document.getElementById('f-key').disabled = true;
        document.getElementById('f-value').value = value;
        document.getElementById('f-type').value = type;
        document.getElementById('f-remark').value = remark;
        document.getElementById('modal-title').textContent = '添加预设配置';
        document.getElementById('modal').classList.remove('hidden');
    }
    
    function closeModal() {
        document.getElementById('modal').classList.add('hidden');
    }
    
    async function handleSubmit(e) {
        e.preventDefault();
        var key = document.getElementById('f-key').value.trim();
        var value = document.getElementById('f-value').value;
        var type = document.getElementById('f-type').value;
        var remark = document.getElementById('f-remark').value;
        
        try {
            var resp = await fetch('/admin/api/settings/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({key: key, value: value, type: type, remark: remark})
            });
            var data = await resp.json();
            if (data.success) {
                showToast('保存成功');
                closeModal();
                loadData();
            } else {
                showToast(data.message || '保存失败', true);
            }
        } catch(e) {
            showToast('保存失败', true);
        }
        return false;
    }
    
    async function deleteSetting(key) {
        if (!confirm('确定要删除配置项 ' + key + ' 吗？')) return;
        try {
            var resp = await fetch('/admin/api/settings/settings/item/' + key, {method: 'DELETE'});
            var data = await resp.json();
            if (data.success) {
                showToast('删除成功');
                loadData();
            } else {
                showToast(data.message || '删除失败', true);
            }
        } catch(e) {
            showToast('删除失败', true);
        }
    }
    
    async function logout() {
        await fetch('/admin/api/auth/logout', {method: 'POST'});
        window.location.href = '/admin/login';
    }
    
    loadData();
    </script>
</body>
</html>
