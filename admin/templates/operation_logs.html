<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志 - FundQuant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: "Inter", system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; margin: 0; }
        .glass-card { background: rgba(30, 30, 50, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(99, 102, 241, 0.15); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); }
        .nav-item { transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(99, 102, 241, 0.2); }
        input, select, textarea { background: rgba(30, 30, 50, 0.6) !important; border: 1px solid rgba(99, 102, 241, 0.2) !important; }
        input:focus, select:focus, textarea:focus { border-color: rgba(99, 102, 241, 0.5) !important; outline: none; }
        .toast { animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 12px; }
    </style>
</head>
<body class="text-white">
    <!-- Toast -->
    <div id="toast" class="fixed top-4 right-4 z-50 hidden">
        <div class="glass-card rounded-xl px-4 py-3 text-sm"></div>
    </div>
    
    <div class="flex min-h-screen">
        <aside class="w-64 glass-card m-4 rounded-2xl p-4 flex flex-col">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5-6-4 10-3-3"/></svg>
                </div>
                <div><h1 class="font-bold text-lg">FundQuant</h1><p class="text-xs text-slate-400">管理后台</p></div>
            </div>
            <nav class="flex-1 space-y-1">
                <a href="/admin/" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>首页概览</span>
                </a>
                <a href="/admin/holdings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>持仓管理</span>
                </a>
                <a href="/admin/models" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg><span>AI模型</span>
                </a>
                <a href="/admin/feishu" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm"><svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>飞书推送</span></a>
                <a href="/admin/apis" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>API管理</span>
                </a>
                <a href="/admin/settings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg><span>系统设置</span>
                </a>
                <a href="/admin/logs" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm active">
                    <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>操作日志</span>
                </a>
            </nav>
            <div class="border-t border-slate-700 pt-4 mt-4">
                <div class="flex items-center justify-between px-4 py-2">
                    <span class="text-sm">Admin</span>
                    <button onclick="logout()" class="text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </div>
        </aside>
        
        <main class="flex-1 p-4 pr-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">操作日志</h2>
                <button onclick="loadData()" class="text-sm text-slate-400 hover:text-white px-3 py-1.5 bg-slate-800/50 rounded-lg">刷新</button>
            </div>
            
            <!-- 筛选 -->
            <div class="glass-card rounded-xl p-4 mb-6">
                <div class="flex flex-wrap gap-4 items-center">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">模块</label>
                        <select id="filter-module" onchange="goPage(1)" class="px-3 py-1.5 rounded-lg text-sm">
                            <option value="">全部模块</option>
                            <option value="holdings">持仓管理</option>
                            <option value="ai_models">AI模型</option>
                            <option value="api_manage">API管理</option>
                            <option value="settings">系统设置</option>
                            <option value="feishu">飞书推送</option>
                            <option value="auth">认证</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">每页</label>
                        <select id="filter-size" onchange="goPage(1)" class="px-3 py-1.5 rounded-lg text-sm">
                            <option value="10">10条</option>
                            <option value="20" selected>20条</option>
                            <option value="50">50条</option>
                            <option value="100">100条</option>
                        </select>
                    </div>
                    <div class="ml-auto flex items-center gap-2 text-sm text-slate-400">
                        共 <span id="total-count" class="text-white font-medium">0</span> 条记录
                    </div>
                </div>
            </div>
            
            <!-- 日志列表 -->
            <div class="glass-card rounded-xl overflow-hidden">
                <table class="w-full">
                    <thead class="bg-slate-800/50">
                        <tr class="text-left text-sm text-slate-400">
                            <th class="px-4 py-3 font-medium">时间</th>
                            <th class="px-4 py-3 font-medium">用户</th>
                            <th class="px-4 py-3 font-medium">模块</th>
                            <th class="px-4 py-3 font-medium">操作</th>
                            <th class="px-4 py-3 font-medium">详情</th>
                            <th class="px-4 py-3 font-medium">IP</th>
                        </tr>
                    </thead>
                    <tbody id="logs-list" class="divide-y divide-slate-700 text-sm">
                        <tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <!-- 分页 -->
            <div class="flex justify-center items-center gap-2 mt-6" id="pagination"></div>
        </main>
    </div>
    
    <script>
    var currentPage = 1;
    var pageSize = 20;
    var totalPages = 0;
    
    var MODULE_NAMES = {
        'holdings': '持仓管理',
        'ai_models': 'AI模型',
        'api_manage': 'API管理',
        'settings': '系统设置',
        'feishu': '飞书推送',
        'auth': '认证'
    };
    
    var ACTION_NAMES = {
        'create': '新增',
        'update': '更新',
        'delete': '删除',
        'login': '登录',
        'logout': '登出',
        'config': '配置',
        'test': '测试',
        'import': '导入',
        'export': '导出'
    };
    
    var MODULE_COLORS = {
        'holdings': 'text-emerald-400 bg-emerald-400/10',
        'ai_models': 'text-purple-400 bg-purple-400/10',
        'api_manage': 'text-amber-400 bg-amber-400/10',
        'settings': 'text-cyan-400 bg-cyan-400/10',
        'feishu': 'text-pink-400 bg-pink-400/10',
        'auth': 'text-indigo-400 bg-indigo-400/10'
    };
    
    var ACTION_COLORS = {
        'create': 'text-green-400 bg-green-400/10',
        'update': 'text-blue-400 bg-blue-400/10',
        'delete': 'text-red-400 bg-red-400/10',
        'login': 'text-green-400 bg-green-400/10',
        'logout': 'text-slate-400 bg-slate-400/10',
        'config': 'text-cyan-400 bg-cyan-400/10',
        'test': 'text-yellow-400 bg-yellow-400/10',
        'import': 'text-purple-400 bg-purple-400/10',
        'export': 'text-orange-400 bg-orange-400/10'
    };
    
    function showToast(msg, isError) {
        var toast = document.getElementById('toast');
        toast.querySelector('div').textContent = msg;
        toast.querySelector('div').className = 'glass-card rounded-xl px-4 py-3 text-sm ' + (isError ? 'text-red-400' : 'text-green-400');
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 3000);
    }
    
    async function loadData() {
        var module = document.getElementById('filter-module').value;
        pageSize = parseInt(document.getElementById('filter-size').value);
        
        try {
            var url = '/admin/api/logs/logs/operation/list?page=' + currentPage + '&page_size=' + pageSize;
            if (module) url += '&module=' + module;
            
            var resp = await fetch(url);
            var data = await resp.json();
            if (data.success) {
                renderList(data.data.items);
                document.getElementById('total-count').textContent = data.data.total;
                totalPages = data.data.pages;
                renderPagination();
            }
        } catch(e) {
            showToast('加载失败', true);
        }
    }
    
    function renderList(items) {
        var el = document.getElementById('logs-list');
        if (!items || items.length === 0) {
            el.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">暂无日志记录</td></tr>';
            return;
        }
        el.innerHTML = items.map(function(log) {
            var modName = MODULE_NAMES[log.module] || log.module;
            var actName = ACTION_NAMES[log.action] || log.action;
            var modColor = MODULE_COLORS[log.module] || 'text-slate-400 bg-slate-400/10';
            var actColor = ACTION_COLORS[log.action] || 'text-slate-400 bg-slate-400/10';
            var time = log.created_at ? log.created_at.substring(0, 19) : '';
            
            return '<tr class="hover:bg-slate-800/30 transition">' +
                '<td class="px-4 py-3 text-slate-400">' + time + '</td>' +
                '<td class="px-4 py-3">' + (log.username || '系统') + '</td>' +
                '<td class="px-4 py-3"><span class="tag ' + modColor + '">' + modName + '</span></td>' +
                '<td class="px-4 py-3"><span class="tag ' + actColor + '">' + actName + '</span></td>' +
                '<td class="px-4 py-3 text-slate-400 max-w-xs truncate" title="' + (log.detail || '') + '">' + (log.detail || '-') + '</td>' +
                '<td class="px-4 py-3 text-slate-500 text-xs">' + (log.ip || '-') + '</td>' +
            '</tr>';
        }).join('');
    }
    
    function renderPagination() {
        var el = document.getElementById('pagination');
        if (totalPages <= 1) {
            el.innerHTML = '';
            return;
        }
        
        var html = '';
        
        // 上一页
        html += '<button onclick="goPage(' + (currentPage - 1) + ')" class="px-3 py-1.5 rounded-lg ' + (currentPage <= 1 ? 'bg-slate-800/50 text-slate-600 cursor-not-allowed' : 'bg-slate-800/50 hover:bg-slate-700/50') + '" ' + (currentPage <= 1 ? 'disabled' : '') + '>上一页</button>';
        
        // 页码
        var start = Math.max(1, currentPage - 2);
        var end = Math.min(totalPages, currentPage + 2);
        
        if (start > 1) {
            html += '<button onclick="goPage(1)" class="px-3 py-1.5 rounded-lg bg-slate-800/50 hover:bg-slate-700/50">1</button>';
            if (start > 2) html += '<span class="px-2 text-slate-500">...</span>';
        }
        
        for (var i = start; i <= end; i++) {
            html += '<button onclick="goPage(' + i + ')" class="px-3 py-1.5 rounded-lg ' + (i === currentPage ? 'btn-gradient' : 'bg-slate-800/50 hover:bg-slate-700/50') + '">' + i + '</button>';
        }
        
        if (end < totalPages) {
            if (end < totalPages - 1) html += '<span class="px-2 text-slate-500">...</span>';
            html += '<button onclick="goPage(' + totalPages + ')" class="px-3 py-1.5 rounded-lg bg-slate-800/50 hover:bg-slate-700/50">' + totalPages + '</button>';
        }
        
        // 下一页
        html += '<button onclick="goPage(' + (currentPage + 1) + ')" class="px-3 py-1.5 rounded-lg ' + (currentPage >= totalPages ? 'bg-slate-800/50 text-slate-600 cursor-not-allowed' : 'bg-slate-800/50 hover:bg-slate-700/50') + '" ' + (currentPage >= totalPages ? 'disabled' : '') + '>下一页</button>';
        
        el.innerHTML = html;
    }
    
    function goPage(page) {
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        loadData();
    }
    
    async function logout() {
        await fetch('/admin/api/auth/logout', {method: 'POST'});
        window.location.href = '/admin/login';
    }
    
    loadData();
    </script>
</body>
</html>
