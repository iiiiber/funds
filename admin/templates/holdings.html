<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>持仓管理 - FundQuant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: "Inter", system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; margin: 0; }
        .glass-card { background: rgba(30, 30, 50, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(99, 102, 241, 0.15); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); }
        .nav-item { transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(99, 102, 241, 0.2); }
        .positive { color: #f472b6; }
        .negative { color: #34d399; }
        input, select { background: rgba(30, 30, 50, 0.6) !important; border: 1px solid rgba(99, 102, 241, 0.2) !important; }
        input:focus, select:focus { border-color: rgba(99, 102, 241, 0.5) !important; outline: none; }
        .spinner { border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid #6366f1; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal { background: rgba(0,0,0,0.6); }
    </style>
</head>
<body class="text-white">
    <div class="flex min-h-screen">
        <!-- 侧边栏 -->
        <aside class="w-64 glass-card m-4 rounded-2xl p-4 flex flex-col">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5-6-4 10-3-3"/></svg>
                </div>
                <div><h1 class="font-bold text-lg">FundQuant</h1><p class="text-xs text-slate-400">管理后台</p></div>
            </div>
                        <nav class="flex-1 space-y-1">
                <a href="/admin/" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>首页概览</span>
                </a>
                <a href="/admin/holdings" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>持仓管理</span>
                </a>
                <a href="/admin/models" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg><span>AI模型</span>
                </a>
                <a href="/admin/feishu" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm"><svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>飞书推送</span></a>
                <a href="/admin/apis" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>API管理</span>
                </a>
                <a href="/admin/settings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg><span>系统设置</span>
                </a>
                <a href="/admin/logs" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>操作日志</span>
                </a>
            </nav>
            <div class="border-t border-slate-700 pt-4 mt-4">
                <div class="flex items-center justify-between px-4 py-2">
                    <span class="text-sm">Admin</span>
                    <button onclick="logout()" class="text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </div>
        </aside>
        
        <!-- 主内容 -->
        <main class="flex-1 p-4 pr-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">持仓管理</h2>
                <div class="flex gap-3">
                    <button onclick="exportData()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm">导出CSV</button>
                    <label class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm cursor-pointer">
                        导入CSV<input type="file" accept=".csv" onchange="importData(this)" class="hidden">
                    </label>
                    <button onclick="refreshNavs()" id="btn-refresh-navs" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm">🔄 刷新净值</button>
                    <button onclick="showAddModal()" class="btn-gradient px-4 py-2 rounded-xl text-sm font-medium">+ 添加持仓</button>
                </div>
            </div>
            
            <div class="glass-card rounded-xl">
                <div class="p-4 border-b border-slate-700">
                    <input type="text" id="search-input" placeholder="搜索基金代码或名称..." 
                           class="w-full max-w-md px-4 py-2 rounded-xl text-sm" onkeyup="handleSearch(event)">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="text-slate-400 text-sm border-b border-slate-700">
                            <tr>
                                <th class="text-left px-4 py-3">基金代码</th>
                                <th class="text-left px-4 py-3">基金名称</th>
                                <th class="text-right px-4 py-3">持有份额</th>
                                <th class="text-right px-4 py-3">成本</th>
                                <th class="text-right px-4 py-3">盈亏</th>
                                <th class="text-right px-4 py-3">更新时间</th>
                                <th class="text-center px-4 py-3">操作</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="text-sm"></tbody>
                    </table>
                </div>
                <div class="p-4 border-t border-slate-700 flex justify-between items-center">
                    <span class="text-slate-400 text-sm" id="total-count"></span>
                    <div class="flex gap-2" id="pagination"></div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- 添加/编辑弹窗 -->
    <div id="modal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold mb-4" id="modal-title">添加持仓</h3>
            <form id="form" onsubmit="return handleSubmit(event)">
                <input type="hidden" id="edit-id">
                <div class="space-y-4">
                    <div><label class="block text-sm text-slate-400 mb-1">基金代码</label><input type="text" id="f-code" required class="w-full px-4 py-2 rounded-xl" placeholder="如: 510300"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">基金名称</label><input type="text" id="f-name" class="w-full px-4 py-2 rounded-xl" placeholder="自动获取或手动输入"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">持有份额</label><input type="number" step="0.0001" id="f-shares" class="w-full px-4 py-2 rounded-xl" placeholder="0"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">买入成本</label><input type="number" step="0.0001" id="f-cost" class="w-full px-4 py-2 rounded-xl" placeholder="0.00"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">备注</label><input type="text" id="f-note" class="w-full px-4 py-2 rounded-xl" placeholder="可选"></div>
                    <div class="flex gap-4"><div class="flex-1"><label class="block text-sm text-slate-400 mb-1">止盈线 (%)</label><input type="number" step="0.01" id="f-alert-profit" class="w-full px-4 py-2 rounded-xl" placeholder="如: 20"></div><div class="flex-1"><label class="block text-sm text-slate-400 mb-1">止损线 (%)</label><input type="number" step="0.01" id="f-alert-loss" class="w-full px-4 py-2 rounded-xl" placeholder="如: 10"></div></div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl">取消</button>
                    <button type="submit" class="flex-1 btn-gradient px-4 py-2 rounded-xl font-medium">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
    var currentPage = 1;
    var pageSize = 20;
    var search = '';
    
    async function loadData() {
        var resp = await fetch('/admin/api/holdings/api/list?page=' + currentPage + '&page_size=' + pageSize + '&search=' + encodeURIComponent(search));
        var data = await resp.json();
        if (data.success) {
            renderTable(data.data.items);
            renderPagination(data.data.total);
        }
    }
    
    function renderTable(items) {
        var tbody = document.getElementById('table-body');
        if (!items || items.length === 0) {
            tbody.innerHTML = '<tr><td colspan='8' class='text-center py-12 text-slate-400'>暂无数据</td></tr>';
            return;
        }
        var html = '';
        var tableData = items;
        items.forEach(function(item) {
            var profitClass = item.profit >= 0 ? 'positive' : 'negative';
            var profitSign = item.profit >= 0 ? '+' : '';
            var alertInfo = '';
            if (item.alert_profit_pct || item.alert_loss_pct) {
                alertInfo = '<span class="text-xs text-slate-500 ml-2">⚠️</span>';
            }
            html += '<tr class="border-b border-slate-800 hover:bg-slate-800/30" data-note="' + (item.note || '') + '" data-alert-profit="' + (item.alert_profit_pct || '') + '" data-alert-loss="' + (item.alert_loss_pct || '') + '">';
            html += '<td class="px-4 py-3 font-mono">' + item.code + '</td>';
            html += '<td class="px-4 py-3">' + item.name + alertInfo + '</td>';
            html += '<td class="px-4 py-3 text-right font-mono">' + item.shares + '</td>';
            html += '<td class="px-4 py-3 text-right font-mono">' + item.cost + '</td>';
            html += '<td class="px-4 py-3 text-right font-mono ' + profitClass + '">' + profitSign + item.profit_pct + '%</td>';
            html += '<td class="px-4 py-3 text-center text-xs">';
if (item.alert_profit_pct) html += '<span class="text-green-400">止盈 ' + item.alert_profit_pct + '%</span>';
if (item.alert_loss_pct) html += '<br><span class="text-red-400">止损 ' + item.alert_loss_pct + '%</span>';
html += '</td>';
            html += '<td class="px-4 py-3 text-center"><button onclick="editItem(' + item.id + ')" class="text-indigo-400 hover:text-indigo-300 mr-3">编辑</button><button onclick="deleteItem(' + item.id + ')" class="text-red-400 hover:text-red-300">删除</button></td>';
            html += '</tr>';
        });
        tbody.innerHTML = html;
    }
    
    function renderPagination(total) {
        var totalPages = Math.ceil(total / pageSize);
        document.getElementById('total-count').textContent = '共 ' + total + ' 条';
        var html = '';
        if (currentPage > 1) html += '<button onclick="goPage(' + (currentPage-1) + ')" class="px-3 py-1 bg-slate-700 rounded">上一页</button>';
        html += '<span class="px-3 py-1">第 ' + currentPage + '/' + totalPages + ' 页</span>';
        if (currentPage < totalPages) html += '<button onclick="goPage(' + (currentPage+1) + ')" class="px-3 py-1 bg-slate-700 rounded">下一页</button>';
        document.getElementById('pagination').innerHTML = html;
    }
    
    function goPage(p) { currentPage = p; loadData(); }
    
    function handleSearch(e) { if (e.key === 'Enter') { search = document.getElementById('search-input').value; currentPage = 1; loadData(); } }
    
    function showAddModal() { document.getElementById('modal-title').textContent = '添加持仓'; document.getElementById('form').reset(); document.getElementById('edit-id').value = ''; document.getElementById('f-alert-profit').value = ''; document.getElementById('f-alert-loss').value = ''; document.getElementById('modal').classList.remove('hidden'); }
    
    function editItem(id) {
        var rows = document.querySelectorAll('#table-body tr');
        var item = null; var itemData = null;
        rows.forEach(function(r) { if (r.querySelector('button[onclick*="editItem(' + id + ')"]')) item = r; });
        if (!item) return;
        document.getElementById('modal-title').textContent = '编辑持仓';
        document.getElementById('edit-id').value = id;
        document.getElementById('f-code').value = item.cells[0].textContent;
        // Use stored data to avoid emoji in name from DOM
        var storedItem = window._tableData ? window._tableData.find(i => i.id == id) : null;
        if (storedItem) {
            document.getElementById('f-name').value = storedItem.name || '';
        } else {
            document.getElementById('f-name').value = item.cells[1].textContent.replace(/[\uD800-\uDFFF]/g, '').trim();
        }
        document.getElementById('f-shares').value = item.cells[2].textContent;
        document.getElementById('f-cost').value = item.cells[3].textContent;
        document.getElementById('f-note').value = item.dataset.note || '';
        document.getElementById('f-alert-profit').value = item.dataset.alertProfit || '';
        document.getElementById('f-alert-loss').value = item.dataset.alertLoss || '';
        document.getElementById('modal').classList.remove('hidden');
    }
    
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    
    async function handleSubmit(e) {
        e.preventDefault();
        var id = document.getElementById('edit-id').value;
        var data = { code: document.getElementById('f-code').value, name: document.getElementById('f-name').value, shares: parseFloat(document.getElementById('f-shares').value) || 0, cost: parseFloat(document.getElementById('f-cost').value) || 0, note: document.getElementById('f-note').value, alert_profit_pct: parseFloat(document.getElementById('f-alert-profit').value) || null, alert_loss_pct: parseFloat(document.getElementById('f-alert-loss').value) || null };
        var url = id ? '/admin/api/holdings/api/' + id : '/admin/api/holdings/api';
        var method = id ? 'PUT' : 'POST';
        var resp = await fetch(url, { method: method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        var result = await resp.json();
        if (result.success) { closeModal(); loadData(); alert(result.message); }
        else alert(result.message);
        return false;
    }
    
    async function deleteItem(id) { if (confirm('确定删除?')) { var resp = await fetch('/admin/api/holdings/api/' + id, {method: 'DELETE'}); var result = await resp.json(); if (result.success) loadData(); } }
    
    async function refreshNavs() {
        var btn = document.getElementById("btn-refresh-navs");
        btn.disabled = true; btn.textContent = "刷新中...";
        var resp = await fetch("/admin/api/holdings/api/refresh-navs", {method:"POST",headers:{"Content-Type":"application/json"}});
        var result = await resp.json();
        btn.disabled = false; btn.textContent = "🔄 刷新净值";
        if (result.success) { alert("✅ 刷新了 " + result.data.count + " 只基金净值"); loadData(); }
        else alert("刷新失败: " + result.message);
    }

    async function exportData() { window.location.href = '/admin/api/holdings/api/export'; }
    
    async function importData(input) {
        var file = input.files[0];
        if (!file) return;
        var formData = new FormData();
        formData.append('file', file);
        var resp = await fetch('/admin/api/holdings/api/import', {method: 'POST', body: formData});
        var result = await resp.json();
        if (result.success) { alert('导入成功: ' + result.data.success + ' 条'); loadData(); }
        else alert('导入失败');
    }
    
    async function logout() { await fetch('/admin/api/auth/logout', {method: 'POST'}); window.location.href = '/admin/login'; }
    
    loadData();
    </script>
</body>
</html>
