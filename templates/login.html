<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录 - FundQuant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: "Inter", system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; margin: 0; }
        .glass-card { background: rgba(30, 30, 50, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(99, 102, 241, 0.2); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); }
        .btn-gradient:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5); }
        input { background: rgba(30, 30, 50, 0.6) !important; border: 1px solid rgba(99, 102, 241, 0.2) !important; }
        input:focus { border-color: rgba(99, 102, 241, 0.5) !important; }
        .spinner { border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center mb-4">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M3 3v18h18"/><path d="M18 9l-5-6-4 10-3-3"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">FundQuant</h1>
            <p class="text-slate-400 mt-2">管理后台</p>
        </div>
        
        <div class="glass-card rounded-2xl p-8">
            <form id="login-form" onsubmit="return handleLogin(event)">
                <div class="mb-6">
                    <label class="block text-slate-400 text-sm mb-2">用户名</label>
                    <input type="text" id="username" name="username" required 
                           class="w-full px-4 py-3 rounded-xl text-white placeholder-slate-500 focus:outline-none"
                           placeholder="请输入用户名">
                </div>
                <div class="mb-6">
                    <label class="block text-slate-400 text-sm mb-2">密码</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 rounded-xl text-white placeholder-slate-500 focus:outline-none"
                           placeholder="请输入密码">
                </div>
                <div id="error-msg" class="hidden text-red-400 text-sm mb-4"></div>
                <button type="submit" id="submit-btn"
                        class="w-full btn-gradient py-3 rounded-xl font-semibold text-white flex items-center justify-center gap-2 transition-all">
                    <span>登 录</span>
                </button>
            </form>
        </div>
        
        <p class="text-center text-slate-500 text-sm mt-6">
            &copy; 2026 FundQuant. All rights reserved.
        </p>
    </div>
    
    <script>
    async function handleLogin(e) {
        e.preventDefault();
        var btn = document.getElementById('submit-btn');
        var err = document.getElementById('error-msg');
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;
        
        if (!username || !password) {
            err.textContent = '请输入用户名和密码';
            err.classList.remove('hidden');
            return;
        }
        
        btn.innerHTML = '<span class="spinner"></span><span>登录中...</span>';
        btn.disabled = true;
        err.classList.add('hidden');
        
        try {
            var resp = await fetch('/admin/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: username, password: password})
            });
            var data = await resp.json();
            
            if (data.success) {
                window.location.href = data.data.redirect || '/admin/';
            } else {
                err.textContent = data.message || '登录失败';
                err.classList.remove('hidden');
                btn.innerHTML = '<span>登 录</span>';
                btn.disabled = false;
            }
        } catch (err2) {
            err.textContent = '网络错误，请重试';
            err.classList.remove('hidden');
            btn.innerHTML = '<span>登 录</span>';
            btn.disabled = false;
        }
    }
    </script>
</body>
</html>
