<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API管理 - FundQuant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: "Inter", system-ui, sans-serif; }
        body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; margin: 0; }
        .glass-card { background: rgba(30, 30, 50, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(99, 102, 241, 0.15); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); }
        .nav-item { transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(99, 102, 241, 0.2); }
        input, select { background: rgba(30, 30, 50, 0.6) !important; border: 1px solid rgba(99, 102, 241, 0.2) !important; }
        input:focus, select:focus { border-color: rgba(99, 102, 241, 0.5) !important; outline: none; }
        .modal { background: rgba(0,0,0,0.6); }
    </style>
</head>
<body class="text-white">
    <div class="flex min-h-screen">
        <aside class="w-64 glass-card m-4 rounded-2xl p-4 flex flex-col">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5-6-4 10-3-3"/></svg>
                </div>
                <div><h1 class="font-bold text-lg">FundQuant</h1><p class="text-xs text-slate-400">管理后台</p></div>
            </div>
                        <nav class="flex-1 space-y-1">
                <a href="/admin/" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>首页概览</span>
                </a>
                <a href="/admin/holdings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>持仓管理</span>
                </a>
                <a href="/admin/models" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg><span>AI模型</span>
                </a>
                <a href="/admin/feishu" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm"><svg class="w-5 h-5 text-pink-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>飞书推送</span></a>
                <a href="/admin/apis" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span>API管理</span>
                </a>
                <a href="/admin/settings" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg><span>系统设置</span>
                </a>
                <a href="/admin/logs" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-sm">
                    <svg class="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>操作日志</span>
                </a>
            </nav>
            <div class="border-t border-slate-700 pt-4 mt-4">
                <div class="flex items-center justify-between px-4 py-2">
                    <span class="text-sm">Admin</span>
                    <button onclick="logout()" class="text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
                </div>
            </div>
        </aside>
        
        <main class="flex-1 p-4 pr-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">API管理</h2>
                <div class="flex gap-3">
                    <button onclick="monitorAll()" class="px-4 py-2 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 rounded-xl text-sm">批量检测</button>
                    <button onclick="showAddModal()" class="btn-gradient px-4 py-2 rounded-xl text-sm font-medium">+ 添加API</button>
                </div>
            </div>
            
            <div class="grid gap-4" id="api-list"></div>
        </main>
    </div>
    
    <div id="modal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold mb-4" id="modal-title">添加API配置</h3>
            <form id="form" onsubmit="return handleSubmit(event)">
                <input type="hidden" id="edit-id">
                <div class="space-y-4">
                    <div><label class="block text-sm text-slate-400 mb-1">配置名称</label><input type="text" id="f-name" required class="w-full px-4 py-2 rounded-xl"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">服务商</label><input type="text" id="f-provider" required class="w-full px-4 py-2 rounded-xl" placeholder="如: eastmoney"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">API地址</label><input type="text" id="f-api-url" required class="w-full px-4 py-2 rounded-xl" placeholder="https://..."></div>
                    <div><label class="block text-sm text-slate-400 mb-1">API密钥</label><input type="password" id="f-api-key" class="w-full px-4 py-2 rounded-xl"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">限流(次/分钟)</label><input type="number" id="f-rate" value="100" class="w-full px-4 py-2 rounded-xl"></div>
                    <div><label class="block text-sm text-slate-400 mb-1">备注</label><input type="text" id="f-remark" class="w-full px-4 py-2 rounded-xl"></div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl">取消</button>
                    <button type="submit" class="flex-1 btn-gradient px-4 py-2 rounded-xl font-medium">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
    var apis = [];
    
    async function loadData() {
        var resp = await fetch('/admin/api/apis/api/list');
        var data = await resp.json();
        if (data.success) { apis = data.data; renderList(); }
    }
    
    function renderList() {
        var el = document.getElementById('api-list');
        if (!apis.length) { el.innerHTML = '<div class="glass-card rounded-xl p-12 text-center text-slate-400">暂无配置，点击上方按钮添加</div>'; return; }
        var html = '';
        apis.forEach(function(a) {
            var statusColor = a.status == 1 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400';
            var statusText = a.status == 1 ? '正常' : '异常';
            html += '<div class="glass-card rounded-xl p-5">';
            html += '<div class="flex justify-between items-start mb-4">';
            html += '<div><h3 class="font-semibold text-lg">' + a.name + '</h3><span class="text-xs text-slate-400">' + a.provider + '</span> <span class="ml-2 text-xs px-2 py-0.5 rounded ' + statusColor + '">' + statusText + '</span></div>';
            html += '<div class="flex gap-2">';
            html += '<button onclick="testApi(' + a.id + ')" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs">测试</button>';
            html += '<button onclick="editApi(' + a.id + ')" class="px-3 py-1 bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-400 rounded-lg text-xs">编辑</button>';
            html += '<button onclick="deleteApi(' + a.id + ')" class="px-3 py-1 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-lg text-xs">删除</button>';
            html += '</div></div>';
            html += '<div class="grid grid-cols-2 gap-4 text-sm">';
            html += '<div><span class="text-slate-400">API地址:</span><p class="font-mono text-xs mt-1 truncate" title="' + a.api_url + '">' + a.api_url + '</p></div>';
            html += '<div><span class="text-slate-400">限流:</span><p class="mt-1">' + a.rate_limit + '次/分</p></div>';
            if (a.last_check) html += '<div><span class="text-slate-400">最后检测:</span><p class="mt-1">' + a.last_check.substring(0, 16) + '</p></div>';
            if (a.last_response) html += '<div><span class="text-slate-400">响应时间:</span><p class="mt-1">' + a.last_response + 'ms</p></div>';
            html += '</div></div>';
        });
        el.innerHTML = html;
    }
    
    function showAddModal() { document.getElementById('modal-title').textContent = '添加API'; document.getElementById('form').reset(); document.getElementById('edit-id').value = ''; document.getElementById('modal').classList.remove('hidden'); }
    
    function editApi(id) {
        var a = apis.find(function(x) { return x.id === id; });
        if (!a) return;
        document.getElementById('modal-title').textContent = '编辑API';
        document.getElementById('edit-id').value = id;
        document.getElementById('f-name').value = a.name;
        document.getElementById('f-provider').value = a.provider;
        document.getElementById('f-api-url').value = a.api_url;
        document.getElementById('f-api-key').value = '';
        document.getElementById('f-rate').value = a.rate_limit;
        document.getElementById('f-remark').value = a.remark || '';
        document.getElementById('modal').classList.remove('hidden');
    }
    
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    
    async function handleSubmit(e) {
        e.preventDefault();
        var id = document.getElementById('edit-id').value;
        var data = { name: document.getElementById('f-name').value, provider: document.getElementById('f-provider').value, api_url: document.getElementById('f-api-url').value, rate_limit: parseInt(document.getElementById('f-rate').value), remark: document.getElementById('f-remark').value };
        var apiKey = document.getElementById('f-api-key').value;
        if (apiKey) data.api_key = apiKey;
        var url = id ? '/admin/api/apis/api/' + id : '/admin/api/apis/api';
        var method = id ? 'PUT' : 'POST';
        var resp = await fetch(url, { method: method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        var result = await resp.json();
        if (result.success) { closeModal(); loadData(); alert(result.message); } else alert(result.message);
        return false;
    }
    
    async function testApi(id) { var resp = await fetch('/admin/api/apis/api/' + id + '/test', {method: 'POST'}); var result = await resp.json(); alert(result.success ? '测试成功: ' + (result.data ? result.data.duration + 'ms' : '') : '测试失败: ' + result.message); }
    async function monitorAll() { var resp = await fetch('/admin/api/apis/api/monitor'); var result = await resp.json(); if (result.success) { alert(result.data.map(function(a) { return a.name + ': ' + a.status; }).join('\n')); loadData(); } }
    async function deleteApi(id) { if (confirm('确定删除?')) { var resp = await fetch('/admin/api/apis/api/' + id, {method: 'DELETE'}); var result = await resp.json(); if (result.success) loadData(); } }
    async function logout() { await fetch('/admin/api/auth/logout', {method: 'POST'}); window.location.href = '/admin/login'; }
    
    loadData();
    </script>
</body>
</html>
