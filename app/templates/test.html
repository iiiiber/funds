<!DOCTYPE html>
<html>
<head><title>API Test</title></head>
<body>
<h1>FundQuant API Test</h1>
<div id="result">Loading...</div>
<script>
fetch('/api/holdings')
  .then(r => r.json())
  .then(d => {
    document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
    document.getElementById('result').style.color = '#0f0';
    document.getElementById('result').style.background = '#111';
    document.getElementById('result').style.padding = '20px';
  })
  .catch(e => {
    document.getElementById('result').textContent = 'Error: ' + e;
    document.getElementById('result').style.color = 'red';
  });
</script>
</body>
</html>
