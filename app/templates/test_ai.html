<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI分析测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-10">
    <h1 class="text-2xl font-bold mb-6">🤖 AI分析功能测试</h1>
    
    <div class="mb-6">
        <button onclick="testAI()" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg">
            点击测试AI分析
        </button>
    </div>
    
    <div id="result" class="bg-slate-800 rounded-xl p-6">
        <p class="text-slate-400">点击按钮开始测试...</p>
    </div>
    
    <script>
        async function testAI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="text-yellow-400">⏳ 分析中，请稍候...</p>';
            
            try {
                const res = await fetch('/api/analyze/015790');
                const data = await res.json();
                
                if (data.success) {
                    const ai = data.ai_report || {};
                    const analysis = data.analysis || {};
                    
                    resultDiv.innerHTML = `
                        <div class="space-y-4">
                            <div class="text-green-400 text-xl">✅ API调用成功!</div>
                            <div class="border-t border-slate-700 pt-4">
                                <h3 class="font-bold text-lg mb-2">基金信息</h3>
                                <p>代码: ${data.data.code}</p>
                                <p>名称: ${data.data.quote?.name || 'N/A'}</p>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg mb-2">基础分析</h3>
                                <p>90日涨跌: ${analysis.momentum_90d?.toFixed(2)}%</p>
                                <p>夏普比率: ${analysis.sharpe_ratio}</p>
                                <p>波动率: ${analysis.volatility?.toFixed(2)}%</p>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg mb-2">AI分析报告</h3>
                                <p>AI评分: <span class="text-2xl font-bold text-purple-400">${ai.score || 'N/A'}</span></p>
                                <p>趋势: ${ai.trend || 'N/A'}</p>
                                <p>建议: ${ai.recommendation || 'N/A'}</p>
                                <p class="mt-2 text-slate-300 whitespace-pre-wrap">${ai.ai_report || 'N/A'}</p>
                            </div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = '<div class="text-red-400">❌ 失败: ' + (data.error || '未知错误') + '</div>';
                }
            } catch (e) {
                resultDiv.innerHTML = '<div class="text-red-400">❌ 请求失败: ' + e.message + '</div>';
            }
        }
    </script>
</body>
</html>
